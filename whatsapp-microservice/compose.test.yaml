services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: whatsapp_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: whatsapp_test
    ports: ["127.0.0.1:54329:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U whatsapp_test -d whatsapp_test"]
      interval: 1s
      timeout: 3s
      retries: 30
