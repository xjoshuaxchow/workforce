server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $workforce_api workforce-api:8310;
    set $whatsapp_api whatsapp-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    location = /health { access_log off; proxy_pass http://$workforce_api$request_uri; }
    location /integrations/ { proxy_pass http://$workforce_api$request_uri; }
    location /api/ { proxy_pass http://$workforce_api$request_uri; }
    location /media/ { proxy_pass http://$workforce_api$request_uri; }
    location = /webhooks/whatsapp { proxy_pass http://$whatsapp_api$request_uri; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
